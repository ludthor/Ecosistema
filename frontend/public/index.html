<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app-container">
        <header id="app-header">
            <div id="app-brand">
                <h1>Ecosystem Simulator</h1>
                <p id="app-subtitle">Deterministic ecosystem runs with live metadata tracking</p>
            </div>
            <div id="header-status">
                <div id="simulation-metadata" aria-live="polite">Seed: — | Step: —</div>
                <div id="replay-status" aria-live="polite">Replay Check: —</div>
            </div>
            <div id="ui-controls"> 
                <input id="seedInput" type="number" placeholder="Seed (optional)" aria-label="Simulation seed">
                <button id="resetWithSeedBtn">Reset</button>
                <button id="resetRandomBtn">Random Reset</button>
                <button id="replayCheckBtn">Replay Check</button>
                <button id="downloadCanvasBtn">Download Canvas</button>
                <button id="themeToggleBtn">Toggle Theme</button>
            </div>
        </header>
        
        <div id="main-content-area">
            <div id="simulation-panel">
                <div id="canvas-parent">
                    <!-- P5.js will insert its canvas here -->
                </div>
                <!-- ui-controls moved to app-header -->
            </div>

            <div id="info-panel">
                <p class="info-panel-placeholder">Loading simulation overview...</p>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
