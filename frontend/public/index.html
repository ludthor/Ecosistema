<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app-container">
        <h1>Ecosystem Simulator</h1> <!-- Kept the H1, moved into app-container -->
        <div id="canvas-parent" style="/* CSS will handle its sizing and positioning */">
            <!-- P5.js will insert its canvas here -->
        </div>
        <div id="ui-controls" style="position: fixed; bottom: 10px; left: 10px; z-index: 100;">
            <button id="downloadCanvasBtn">Download Canvas</button>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
